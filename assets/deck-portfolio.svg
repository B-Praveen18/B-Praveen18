<svg xmlns="http://www.w3.org/2000/svg" width="200" height="320" viewBox="0 0 200 320" role="img" aria-label="PORTFOLIO">
  <title>PORTFOLIO</title>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/><stop offset="0.45" stop-color="#9ca3af"/><stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="0.55" stop-color="#2563eb"/><stop offset="1" stop-color="#0b1d4d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7280"/><stop offset="0.5" stop-color="#f3f4f6"/><stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-10%" width="160%" height="130%"><feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <style>
    .swing { transform-origin: 100px 24px; animation: sw 4.2s ease-in-out infinite; animation-delay: -2.6s; }
    .tag { transform-origin: 106px 52px; animation: tg 4.2s ease-in-out infinite; animation-delay: -2.6s; }
    @keyframes sw { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes tg { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { .swing, .tag { animation: none; } }
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <!-- rail -->
  <rect x="0" y="10" width="200" height="14" rx="7" fill="url(#rail)"/>
  <rect x="0" y="12" width="200" height="2" fill="#fff" opacity="0.45"/>

  <g class="swing">
    <!-- hook -->
    <path d="M100 56 L100 17 A7 7 0 0 1 114 17 L114 27" stroke="url(#metal)" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- deck board -->
    <g filter="url(#drop)">
      <rect x="58" y="52" width="84" height="256" rx="42" fill="url(#board)"/>
      <rect x="58" y="52" width="84" height="256" rx="42" fill="url(#shine)"/>
      <rect x="58" y="52" width="84" height="256" rx="42" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
    </g>
    <circle cx="100" cy="64" r="4" fill="#000" opacity="0.75"/>
    <circle cx="100" cy="64" r="4" fill="none" stroke="#fff" stroke-opacity="0.35"/>

    <!-- title along the board -->
    <g transform="translate(100 186) rotate(-90)">
      <text text-anchor="middle" font-size="19" font-weight="800" letter-spacing="3" fill="#dbeafe" y="6">PORTFOLIO</text>
    </g>
    <path d="M100 100 L100 112 M100 262 L100 274" stroke="#dbeafe" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>

    <!-- price-tag style label -->
    <g class="tag">
      <line x1="106" y1="52" x2="106" y2="66" stroke="#9ca3af" stroke-width="1"/>
      <rect x="96" y="66" width="74" height="18" rx="3" fill="#f9fafb" stroke="#111827" stroke-opacity="0.15"/>
      <circle cx="102" cy="70" r="1.6" fill="#9ca3af"/>
      <text x="133.0" y="79" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111827">TypeScript</text>
    </g>
  </g>
</svg>
