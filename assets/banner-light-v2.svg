<svg xmlns="http://www.w3.org/2000/svg" width="830" height="280" viewBox="0 0 830 280" role="img" aria-label="Praveen B, CS student and full-stack developer">
  <title>Praveen B</title>
  <defs>
    <clipPath id="frame"><rect width="830" height="280" rx="14"/></clipPath>
    <pattern id="rest" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13.0" cy="13.0" r="1.4" fill="#6366f1" fill-opacity="0.28"/>
    </pattern>
    <pattern id="hot" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13.0" cy="13.0" r="3.2" fill="#6366f1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <mask id="wave" maskUnits="userSpaceOnUse" x="0" y="0" width="830" height="280">
      <rect width="830" height="280" fill="#000"/>
      <g filter="url(#soft)">
      <circle cx="600" cy="85" r="0" fill="none" stroke="#fff" stroke-width="52">
        <animate attributeName="r" values="0;760" dur="4.2s" begin="-1.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="1;0.55;0" keyTimes="0;0.5;1" dur="4.2s" begin="-1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="205" r="0" fill="none" stroke="#fff" stroke-width="52">
        <animate attributeName="r" values="0;760" dur="4.2s" begin="-2.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="1;0.55;0" keyTimes="0;0.5;1" dur="4.2s" begin="-2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="215" r="0" fill="none" stroke="#fff" stroke-width="52">
        <animate attributeName="r" values="0;760" dur="4.2s" begin="-0.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="1;0.55;0" keyTimes="0;0.5;1" dur="4.2s" begin="-0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="75" r="0" fill="none" stroke="#fff" stroke-width="52">
        <animate attributeName="r" values="0;760" dur="4.2s" begin="-3.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="1;0.55;0" keyTimes="0;0.5;1" dur="4.2s" begin="-3.6s" repeatCount="indefinite"/>
      </circle>
      </g>
    </mask>
    <radialGradient id="wash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  </style>
  <g clip-path="url(#frame)">
    <rect width="830" height="280" fill="#ffffff"/>
    <rect width="830" height="280" fill="url(#rest)"/>
    <rect width="830" height="280" fill="url(#hot)" mask="url(#wave)"/>
    <ellipse cx="415.0" cy="140.0" rx="300" ry="105" fill="url(#wash)"/>

    <g text-anchor="middle">
      <rect x="287.0" y="62" width="256" height="26" rx="13" fill="#ffffff" stroke="#d1d9e0"/>
      <circle cx="303.0" cy="75" r="3" fill="#6366f1"/>
      <text x="423.0" y="79.5" font-size="12.5" font-weight="500" fill="#59636e">CS student · Mepco Schlenk, Sivakasi</text>
      <text x="415.0" y="148" font-size="50" font-weight="700" letter-spacing="-1" fill="#1f2328">Hi, I&#8217;m Praveen B</text>
      <text x="415.0" y="186" font-size="16" fill="#59636e">Full-stack (React + TypeScript) · AI-powered apps · ML &amp; IoT</text>
      <text x="415.0" y="210" font-size="13" fill="#59636e" fill-opacity="0.8">C · OS · DBMS · Networks · Compilers</text>
    </g>
  </g>
</svg>
